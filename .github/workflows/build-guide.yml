# Builds SCARA's small sports TV guide twice a day and saves it in this repository, where the app
# reads it from:  https://raw.githubusercontent.com/<your-name>/<this-repo>/main/guide.xml.gz
name: Build guide

on:
  schedule:
    - cron: "20 5,17 * * *"   # 05:20 and 17:20 UTC
  workflow_dispatch:           # the "Run workflow" button, to build one now

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the guide
        run: python build_guide.py

      - name: Save it
        run: |
          git config user.name "guide-bot"
          git config user.email "guide-bot@users.noreply.github.com"
          git add guide.xml guide.xml.gz
          git diff --cached --quiet || git commit -m "Update guide"
          git push
